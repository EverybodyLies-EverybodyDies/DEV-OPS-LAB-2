
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-api:1.0
    container_name: task-api
    volumes:
      - shared-logs:/shared
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: task-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  log-collector:
    image: alpine:3.20
    container_name: task-log-collector
    command: >
      sh -c "touch /shared/app.log &&
      tail -n 20 -F /shared/app.log"
    volumes:
      - shared-logs:/shared
    restart: unless-stopped

volumes:
  shared-logs:
