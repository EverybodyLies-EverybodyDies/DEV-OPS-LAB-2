
apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-app-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-app

  template:
    metadata:
      labels:
        app: task-app

    spec:
      containers:

        # 1. Python REST API
        - name: task-api
          image: everybodylieseverybodydies/task-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          volumeMounts:
            - name: shared-logs
              mountPath: /shared

        # 2. Nginx
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

        # 3. Log Collector
        - name: log-collector
          image: alpine:3.20

          command:
            - /bin/sh
            - -c
            - |
              touch /shared/app.log
              echo "Log Collector started"
              tail -n 20 -F /shared/app.log

          volumeMounts:
            - name: shared-logs
              mountPath: /shared

      volumes:

        # Shared temporary storage
        - name: shared-logs
          emptyDir: {}

        # Nginx configuration
        - name: nginx-config
          configMap:
            name: nginx-config
